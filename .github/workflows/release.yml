name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build-args: "--bundles deb,rpm,appimage"
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: macos-latest
            build-args: "--target universal-apple-darwin --bundles dmg"
            artifact-path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            build-args: "--bundles nsis,msi"
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Add universal macOS Rust targets
        if: startsWith(matrix.os, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Fetch ffmpeg sidecars for this platform
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-latest)
              # universal app: lipo-merged ffmpeg/ffprobe sidecars
              ./scripts/prepare-sidecars.sh universal-apple-darwin
              ;;
            *)
              ./scripts/prepare-sidecars.sh
              ;;
          esac

      - name: Install JS deps
        run: npm ci || npm install

      - name: Build and bundle
        run: npm run tauri build -- ${{ matrix.build-args }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lantern-${{ matrix.os }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          fail_on_unmatched_files: true
